name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Set up Android SDK & accept licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true

      - name: 5. Install NPM Dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android

      - name: 6. Build Web Production Bundle (Vite)
        run: |
          npm run build

      - name: 7. Initialize Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found. Adding android platform via Capacitor..."
            npx cap add android
          fi
          echo "Syncing web assets to Capacitor Android project..."
          npx cap sync android

      - name: 8. Setup Release Keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Custom ANDROID_KEYSTORE_BASE64 provided in secrets. Decoding..."
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore
          fi
          echo "Using permanent release keystore:"
          ls -la android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: 9. Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          echo "Building signed Release APK with permanent keystore..."
          ./gradlew assembleRelease --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'CryptoWorld@2026Key' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'cryptoworld' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'CryptoWorld@2026Key' }}

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoWorld-Release-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
