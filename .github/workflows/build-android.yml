name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Capacitor Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Android SDK & accept licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true

      - name: 5. Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-dep

      - name: 6. Build Web Production Bundle (Vite)
        run: |
          npm run build

      - name: 7. Initialize Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder not found. Adding android platform via Capacitor..."
            npx cap add android
          fi
          echo "Syncing web assets to Capacitor Android project..."
          npx cap sync android

      - name: 8. Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 9. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoWorld-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
